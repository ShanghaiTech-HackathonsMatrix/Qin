<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>秦 · 手机预览</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: #ededea; color: #111; font: 14px/1.5 'Segoe UI','Microsoft YaHei',sans-serif; }
    header { padding: 17px clamp(18px, 4vw, 54px); background: #fff; border-bottom: 2px solid #111; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
    header h1 { margin: 0; font-size: 21px; letter-spacing: -.04em; }
    header span { font-size: 12px; color: #555; }
    main { display: flex; justify-content: center; gap: clamp(20px, 5vw, 80px); padding: 22px 18px 46px; align-items: flex-start; flex-wrap: wrap; }
    aside { width: 218px; padding: 18px; background: #fff; border: 2px solid #111; border-radius: 10px 12px 9px 11px; }
    aside h2 { margin: 0 0 4px; font-size: 18px; } aside p { color: #555; font-size: 12px; margin: 0 0 4px; }
    label.sec { display: block; font-size: 11px; font-weight: 800; letter-spacing: .1em; margin: 17px 0 7px; }
    button, a { font: inherit; }
    .group { display: flex; flex-wrap: wrap; gap: 6px; }
    .group button, .reset { background: #fff; border: 1.5px solid #111; border-radius: 7px 9px 6px 8px; padding: 6px 9px; cursor: pointer; font-size: 12px; color: #111; }
    .group button[aria-pressed='true'] { background: #111; color: #fff; }
    .reset { display: inline-block; margin-top: 18px; text-decoration: none; font-weight: 700; }
    .hint { border-top: 1px solid #ccc; padding-top: 12px; margin-top: 18px; font-size: 11px; color: #555; line-height: 1.6; }
    .stage { display: flex; flex-direction: column; align-items: center; min-width: 0; max-width: 100%; }
    .stage__label { margin-bottom: 10px; font: bold 11px Georgia,serif; letter-spacing: .14em; }
    .fit { position: relative; flex: 0 0 auto; }
    .phone { position: absolute; top: 0; left: 0; background: #111; border: 10px solid #111; border-radius: 43px; overflow: hidden; display: flex; flex-direction: column; transform-origin: top left; box-shadow: 8px 12px 0 #c6c6c0; }
    .status { height: 26px; flex: 0 0 26px; display: flex; align-items: center; justify-content: space-between; padding: 0 19px; background: #fff; font: 700 11px Georgia,serif; }
    .screen { display: block; border: 0; width: 100%; flex: 1; background: #f7f7f3; }
    .gesture { height: 19px; background: #fff; display: grid; place-items: center; flex: 0 0 19px; }
    .gesture::before { content: ''; width: 100px; height: 4px; border-radius: 8px; background: #111; }
    @media (max-width: 820px) { main { gap: 18px; padding-top: 16px; } aside { width: min(390px, 100%); } }
  </style>
</head>
<body>
  <header><h1>秦 / QIN</h1><span>手机模拟器 · 内嵌真实应用 · 演示数据不写入本机</span></header>
  <main>
    <aside>
      <h2>预览控制台</h2>
      <p>手机框只是外壳，里面跑的就是应用本身。</p>

      <label class="sec">设备尺寸</label>
      <div class="group" id="sizes"></div>

      <label class="sec">页面</label>
      <div class="group" id="pages"></div>

      <label class="sec">快照</label>
      <div class="group" id="extras"></div>

      <a class="reset" href="/?demo=1" target="_blank" rel="noopener">新窗口打开演示应用 ↗</a>

      <div class="hint">
        「任务详情」会直接打开 DDL 详情抽屉，省得每次手动点。<br />
        时间相对今天生成；手机内可正常滚动与切页。
      </div>
    </aside>

    <div class="stage">
      <div class="stage__label" id="caption">390 × 844 / MOBILE</div>
      <div class="fit" id="fit">
        <div class="phone" id="phone">
          <div class="status"><span>9:41</span><span>▮▮ ᴡɪғɪ ◕</span></div>
          <iframe id="screen" class="screen" title="秦应用演示"></iframe>
          <div class="gesture"></div>
        </div>
      </div>
    </div>
  </main>

  <script>
    const SIZES = [
      { name: '小屏', width: 360, height: 780 },
      { name: '标准', width: 390, height: 844 },
      { name: '大屏', width: 430, height: 932 },
    ];
    const PAGES = [
      { id: 'home', name: '首页' },
      { id: 'timeline', name: '任务' },
      { id: 'courses', name: '日程' },
      { id: 'settings', name: '设置' },
    ];
    const EXTRAS = [
      { id: 'home', name: 'DDL 详情', page: 'home', ddl: 'ddl-studio' },
      { id: 'home', name: '逾期 DDL', page: 'home', ddl: 'ddl-graph' },
    ];

    let size = SIZES[1];
    let page = 'home';
    let ddl = null;

    const $ = (id) => document.getElementById(id);
    const fit = $('fit');
    const phone = $('phone');
    const screen = $('screen');

    function target() {
      const q = new URLSearchParams({ demo: '1', page });
      if (ddl !== null) q.set('ddl', ddl);
      return `/?${q.toString()}`;
    }

    function fitPhone() {
      const frameW = size.width + 20;
      const frameH = size.height + 65;
      const scale = Math.min(1, Math.max(0.5, (window.innerWidth - 36) / frameW));
      phone.style.width = `${frameW}px`;
      phone.style.height = `${frameH}px`;
      phone.style.transform = `scale(${scale})`;
      fit.style.width = `${frameW * scale}px`;
      fit.style.height = `${frameH * scale}px`;
      $('caption').textContent = `${size.width} × ${size.height} / MOBILE`;
    }

    function syncButtons() {
      document.querySelectorAll('#sizes button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.name === size.name)));
      document.querySelectorAll('#pages button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.page === page && ddl === null)));
      document.querySelectorAll('#extras button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.name === ddl)));
    }

    function navigate() {
      const next = target();
      if (screen.getAttribute('src') !== next) screen.setAttribute('src', next);
      syncButtons();
    }

    function paint() { fitPhone(); navigate(); }

    function addButton(container, label, onClick, extra) {
      const b = document.createElement('button');
      b.textContent = label;
      if (extra) Object.assign(b.dataset, extra);
      b.addEventListener('click', onClick);
      $(container).append(b);
    }

    SIZES.forEach((preset) => addButton('sizes', preset.name, () => { size = preset; paint(); }, { name: preset.name }));
    PAGES.forEach((route) => addButton('pages', route.name, () => { page = route.id; ddl = null; paint(); }, { page: route.id }));
    EXTRAS.forEach((extra) => addButton('extras', extra.name, () => { page = extra.page; ddl = extra.ddl; paint(); }, { name: extra.id }));

    window.addEventListener('resize', fitPhone);
    paint();
  </script>
</body>
</html>
